    return a;

  const examAvg = lastExams.length ? lastExams.reduce((a, b) => a + b, 0) / lastExams.length : accuracy;
  const recent = trend.slice(-3);

  const projected = Math.round(examAvg * 0.5 + recentAcc * 0.5);
  const PASS = 75;

  const day = d => Number(d.split(" ")[1]);
  const TODAY = 30;
  const lastSeen = {};
  SESSIONS.forEach(s => Object.keys(s.results).forEach(q => {
    if (practiceIds.has(q)) lastSeen[q] = day(s.date);
  }));
  const due = Object.keys(latest).filter(q => !latest[q] || TODAY - lastSeen[q] >= 7);

  // This week: practice questions answered in the last 7 days
  const weekGoal = 30;
  const weekDone = trend.filter(t => TODAY - day(t.date) < 7).reduce((a, t) => a + t.n, 0);
  return {
    accuracy,
    coverage,
    missed,
    topics,
    trend,
    examTrend,
    readiness,
    volume: total,
    bestExam,
    delta,
    modeSplit,
    projected,
    PASS,
    examAvg: Math.round(examAvg),
    recentAcc,
    due,
    weekGoal,
    weekDone
  };
}
